version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: itas-audit-test-db
    environment:
      POSTGRES_DB: itas_audit_test
      POSTGRES_USER: itas_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itas_test -d itas_audit_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
