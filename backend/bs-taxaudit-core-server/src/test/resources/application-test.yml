spring:
  application:
    name: bs-taxaudit-core-server-test

  profiles:
    active: test

  datasource:
    # Will be configured via Testcontainers
    url: jdbc:postgresql://localhost:5432/itas_audit_test
    username: itas_test
    password: test_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/itas

server:
  port: 0

logging:
  level:
    root: INFO
    com.act.audit: DEBUG
    org.springframework.test: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
