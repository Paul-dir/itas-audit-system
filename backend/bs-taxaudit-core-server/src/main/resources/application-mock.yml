# Mock/Test Profile - Connects to Docker test PostgreSQL database
# Automatically activated during local development and testing

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:itas_audit}
    username: ${DB_USER:itas_dev}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 10
    open-in-view: false

  flyway:
    enabled: false

  data:
    web:
      pageable:
        one-indexed-parameters: false
        default-page-size: 25
        max-page-size: 100

server:
  port: 8080

logging:
  level:
    root: INFO
    mor.itas: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
